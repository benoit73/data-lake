name: data-lake

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${S3_REGION}
  AWS_ENDPOINT_URL: http://garage:3900

services:
  # ---------- Stockage S3 ----------
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    ports:
      - "127.0.0.1:3900:3900"   # API S3
      - "127.0.0.1:3903:3903"   # API admin
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # Initialise Garage (layout, clé S3, buckets) puis s'arrête
  garage-init:
    image: alpine:3.22
    depends_on:
      - garage
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKETS: ${S3_BUCKETS}
    volumes:
      - ./garage/init.sh:/init.sh:ro
    command: sh -c "apk add --no-cache curl jq >/dev/null && sh /init.sh"

  # Interface web pour parcourir les buckets (Garage n'en a pas)
  garage-webui:
    image: khairul169/garage-webui:latest
    restart: unless-stopped
    depends_on:
      garage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3909:3909"
    environment:
      API_BASE_URL: http://garage:3903
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN}
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: ${S3_REGION}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro

  # ---------- Airflow ----------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.1.0
    restart: unless-stopped
    command: standalone
    user: "${AIRFLOW_UID}:0"
    depends_on:
      postgres:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *s3-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Les DAGs démarrent actifs : le téléchargement des sources part tout seul
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Dev local : pas d'écran de login
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Connexion Airflow "garage_s3" utilisable avec S3Hook(aws_conn_id="garage_s3")
      AIRFLOW_CONN_GARAGE_S3: >-
        {"conn_type": "aws",
         "login": "${S3_ACCESS_KEY_ID}",
         "password": "${S3_SECRET_ACCESS_KEY}",
         "extra": {"endpoint_url": "http://garage:3900", "region_name": "${S3_REGION}"}}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs

  # ---------- Jupyter ----------
  jupyter:
    build: ./jupyter
    restart: unless-stopped
    depends_on:
      garage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      <<: *s3-env
      JUPYTER_PASSWORD: ${JUPYTER_PASSWORD:-jupyter}
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data

volumes:
  garage-meta:
  garage-data:
  postgres-data:
  airflow-logs:
